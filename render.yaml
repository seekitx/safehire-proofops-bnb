services:
  - type: web
    name: safehire-proofops-bnb
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_REPO_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: EXECUTION_MODE
        value: demo
      - key: EXECUTION_ADAPTER
        value: demo
      - key: ALLOW_ONCHAIN_EXECUTION
        value: "false"
      - key: ALLOW_BSC_MAINNET
        value: "false"
      - key: ALLOW_EXTERNAL_MAINNET_HIRE
        value: "true"
      - key: BSC_TESTNET_RPC_URL
        value: https://data-seed-prebsc-1-s1.bnbchain.org:8545
      - key: BSC_MAINNET_RPC_URL
        value: https://bsc-dataseed.bnbchain.org
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
