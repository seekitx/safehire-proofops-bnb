name: publish-judge-ready-delivery
on:
  push:
    branches:
      - "review/judge-winning-proofops-20260831"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-judge-ready-delivery
  cancel-in-progress: false
jobs:
  validate-package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/judge-winning-proofops-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Verify and apply patch bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-bundle.part-* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.tar.gz
          echo "fbc9c5a67bedd8d385055e0a5fce14d876c06c714df4597b6bd34dbb922dba55  /tmp/patch.tar.gz" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import tarfile

          root = Path.cwd().resolve()
          with tarfile.open("/tmp/patch.tar.gz", "r:gz") as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
              archive.extractall(root, filter="data")
          PY
          rm -f .github/patch-bundle.part-* .github/workflows/apply-judge-patch.yml
      - name: Install Python dependencies
        run: pip install -e '.[dev,bnb]'
      - name: Apply reviewed source fixes
        run: |
          ruff check src/proofops/judging/scorecard.py --fix --unsafe-fixes
          python .github/adversarial-mypy-fix.py
          rm -f .github/adversarial-mypy-fix.py
      - name: Lint and typecheck
        run: |
          ruff check src apps tests scripts
          mypy src apps scripts
      - name: Compile and test contracts
        working-directory: contracts
        run: |
          npm ci --ignore-scripts
          npm run compile
          npm test
          npm audit --omit=dev
      - name: Test Python application
        run: pytest --cov=proofops --cov=apps --cov-report=term-missing --cov-fail-under=75
      - name: Security and submission gates
        run: |
          python scripts/static_security_check.py
          python scripts/submission_gate.py --allow-incomplete
          python scripts/judge_scorecard.py --output judge-scorecard.json
      - name: Build BNB Agent Studio seller
        working-directory: agent-studio/safehireagents
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir app/agent build
      - name: Build container and release archive
        run: |
          docker build -t safehire-proofops:${{ github.sha }} .
          python scripts/build_release.py
          mkdir -p dist
          cp ../safehire-proofops-bnb-release.zip dist/
          cp ../safehire-proofops-bnb-release.manifest.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: safehire-proofops-bnb-judge-ready
          path: |
            dist/safehire-proofops-bnb-release.zip
            dist/safehire-proofops-bnb-release.manifest.json
            judge-scorecard.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish clean non-workflow patch to final branch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            AGENTS.md
            Makefile
            README.md
            agent.md
            apps/web/assets/judge-scorecard.css
            apps/web/assets/judge-scorecard.html
            apps/web/assets/judge-scorecard.js
            docs/05_MULTI_AGENT_ADVERSARIAL_REVIEW.md
            docs/11_JUDGE_WINNING_STRATEGY_2026-08-31.md
            docs/12_ADVERSARIAL_CONSENSUS_2026-08-31.md
            docs/HACKATHON_SUBMISSION_READINESS_2026-08-31.md
            docs/PAST_WINNERS_AND_JUDGE_PATTERNS_2026-08-31.md
            evidence/judging-notes/adversarial-consensus-2026-08-31.json
            evidence/judging-notes/adversarial-decision.json
            scripts/judge_scorecard.py
            src/proofops/judging/__init__.py
            src/proofops/judging/scorecard.py
            src/proofops/plugins/adversarial.py
            submission/submission.json
            tests/test_judge_scorecard.py
            tests/test_lp_benchmark_debate.py
          )
          tar -czf /tmp/nonworkflow-patch.tar.gz "${files[@]}"
          git fetch origin main review/judge-ready-final-20260831
          git reset --hard origin/main
          git clean -fdx
          tar -xzf /tmp/nonworkflow-patch.tar.gz
          python -m compileall -q src/proofops/judging src/proofops/plugins/adversarial.py scripts/judge_scorecard.py tests/test_judge_scorecard.py tests/test_lp_benchmark_debate.py
          node --check apps/web/assets/judge-scorecard.js
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("submission/submission.json"),
              Path("evidence/judging-notes/adversarial-consensus-2026-08-31.json"),
              Path("evidence/judging-notes/adversarial-decision.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
          PY
          test -z "$(git diff --name-only origin/main -- .github/workflows)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "feat: add judge-ready proof-carrying marketplace review"
          git push origin HEAD:review/judge-ready-final-20260831
